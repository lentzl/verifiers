# Held-out native Prime Agent depth-one delegation and family messaging.

model = "/ephemeral/models/qwen35-file-processing-r1"
num_tasks = 8
num_rollouts = 2
shuffle = false
max_concurrent = 1
verbose = false
rich = false
server = false
push = false
output_dir = "/ephemeral/evals/qwen35-subagent-communication"

[env]
max_concurrent_agents = 1

[env.taskset]
id = "subagent-communication-v1"
split = "eval"
instruction_level = "standard"
instances_per_template = 1
seed = 20260809

[env.agent]
max_turns = 18
max_output_tokens = 16384
max_total_tokens = 49152

[env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 1
model_context_window = 32768

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 900.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.8
max_tokens = 2048
