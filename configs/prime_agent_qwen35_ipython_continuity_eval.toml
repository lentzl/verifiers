# Eight held-out continuity tasks with two samples each.

model = "/ephemeral/models/qwen35-adaptive-skills-smoke-r1"
num_tasks = 8
num_rollouts = 2
shuffle = false
max_concurrent = 3
verbose = false
rich = false
server = false
push = false
output_dir = "/ephemeral/evals/qwen35-ipython-continuity"

[env]
max_concurrent_agents = 1

[env.taskset]
id = "ipython-foundations-v1"
split = "eval"
families = ["assignment", "state"]
instruction_level = "standard"
instances_per_template = 2
seed = 20260806

[env.agent]
max_turns = 12
max_output_tokens = 8192
max_total_tokens = 24576

[env.agent.harness]
id = "prime-agent"
version = "0.7.0"
save_session = true
max_depth = 0

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 600.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.8
max_tokens = 1024
