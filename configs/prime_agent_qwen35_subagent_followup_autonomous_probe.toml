# Native headless continuation while fire-and-forget children steer the root.

model = "/ephemeral/subagent-rung/outputs/12-followup-message-grounding-sft-r1/weights/step_40"
num_tasks = 1
num_rollouts = 4
shuffle = false
max_concurrent = 1
verbose = false
rich = false
server = false
push = false
output_dir = "/ephemeral/evals/qwen35-subagent-followup-autonomous-probe"

[env]
max_concurrent_agents = 1

[env.taskset]
id = "subagent-communication-v1"
split = "train"
families = ["followup"]
instruction_level = "guided"
instances_per_template = 1
instance_offset = 180
seed = 20260909

[env.agent]
# Keep this isolated delegation probe below Prime Agent's default turn-25
# continual-harness refinement checkpoint.
max_turns = 20
max_output_tokens = 16384
max_total_tokens = 65536

[env.agent.harness]
id = "prime_agent"
version = "0.7.0"
autonomous = true
gates = ["python /workspace/.subagent-communication/completion_gate.py"]

[env.agent.runtime]
type = "docker"
image = "python:3.11-slim"

[env.agent.timeout]
setup = 300.0
rollout = 360.0
finalize = 60.0
scoring = 60.0

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[sampling]
temperature = 0.8
max_tokens = 2048
