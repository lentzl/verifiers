[project]
name = "rlm-orientation-v1"
version = "0.1.0"
tags = ["rlm", "sandbox", "v1", "orientation"]
license = "Apache-2.0"
description = "Minimal RLM orientation environment that requires IPython tool use through rlm-harness."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.13.dev0",
    "harnesses>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["rlm_orientation_v1.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 2
rollouts_per_example = 1
