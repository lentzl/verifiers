[project]
name = "subagent-admission-v1"
version = "0.1.0"
description = "Spawn-first admission control for the Prime Agent RLM curriculum."
requires-python = ">=3.11"
dependencies = ["verifiers", "subagent-communication-v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subagent_admission_v1"]
