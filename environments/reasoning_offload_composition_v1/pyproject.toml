[project]
name = "reasoning-offload-composition-v1"
version = "0.1.0"
description = "File-backed tasks for repairing and composing provided operations through the RLM harness."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reasoning_offload_composition_v1"]
