[project]
name = "ipython-foundations-v1"
version = "0.3.0"
description = "Persistent IPython state, recovery, and subprocess streams for Prime Agent."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ipython_foundations_v1"]
