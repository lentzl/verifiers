[project]
name = "reasoning-offload-orientation-v1"
version = "0.1.0"
description = "File-backed orientation tasks for selective reasoning offload through the RLM harness."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reasoning_offload_orientation_v1"]
