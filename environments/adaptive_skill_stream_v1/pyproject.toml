[project]
name = "adaptive-skill-stream-v1"
version = "0.1.0"
description = "Linked Prime Agent task streams for local adaptation and durable portable skill reuse."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adaptive_skill_stream_v1"]
